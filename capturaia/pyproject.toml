[project]
name = "capturaia"
version = "0.1.0"
description = "Captura el frame de una capturadora con una tecla, lo envía a Gemini y muestra la respuesta en un panel lateral"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6-Essentials>=6.7",
    "PySide6-Addons>=6.7",  # QtMultimedia (capturadora y vista previa)
    "google-genai>=1.0",
    "pynput>=1.7.7",
    "segno>=1.6",
]

[project.optional-dependencies]
# Fuente de captura alternativa (DirectShow) por si Qt Multimedia no abre bien la capturadora.
opencv = ["opencv-python>=4.9", "numpy>=1.26"]

[project.scripts]
capturaia = "capturaia.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.10.4,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PL", "PTH"]
ignore = ["PLR2004", "PLR0913", "N802"]

[tool.ruff.lint.per-file-ignores]
# HTML/JS de la página del móvil y signos tipográficos (A−, ☀−) a propósito.
"src/capturaia/phone.py" = ["E501", "RUF001"]
"src/capturaia/ui/phone_dialog.py" = ["RUF001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
